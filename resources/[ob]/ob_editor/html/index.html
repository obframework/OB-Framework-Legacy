<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><title>Editor OB</title></head><body><main id="app" class="hidden"><section><header><div><small>OB FRAMEWORK</small><h1>Editor do mundo</h1></div><button id="close">×</button></header><div class="grid"><form id="form"><input id="label" placeholder="Nome do blip" maxlength="80" required><div><input id="sprite" type="number" value="1" min="1" max="900" placeholder="Icone"><input id="color" type="number" value="3" min="0" max="85" placeholder="Cor"><input id="scale" type="number" value="0.8" min="0.4" max="2" step="0.1" placeholder="Escala"></div><label><input id="shortRange" type="checkbox" checked> Mostrar apenas no minimapa proximo</label><p>Salvar cria o blip na sua posicao atual.</p><button>Salvar blip</button></form><aside><b>Blips criados</b><div id="list"></div></aside></div></section></main><script src="app.js"></script></body></html>
