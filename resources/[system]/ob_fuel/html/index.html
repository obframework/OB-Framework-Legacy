<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head>
<body><main id="app" class="hidden"><section class="panel"><header><div><small>OB FRAMEWORK</small><h1 id="title">Abastecimento</h1><p id="vehicle">Veiculo</p></div><button id="close">×</button></header>
<div id="fuel-content"><div class="fuel-types"><button data-type="gasoline">Gasolina</button><button data-type="diesel">Diesel</button></div><div class="stats"><div><small>NIVEL ATUAL</small><strong id="level">0%</strong></div><div><small>CAPACIDADE</small><strong id="capacity">0 L</strong></div><div><small>PRECO</small><strong id="price" data-ob-money="0" data-ob-suffix="/L">$0/L</strong></div></div><label>Quantidade <b id="liters">0.0 L</b><input id="amount" type="range" min="0" max="0" step="0.5" value="0"></label><div class="total"><span>Total</span><strong id="total" data-ob-money="0">$0</strong></div><button id="confirm" class="confirm">Abastecer</button><p class="hint">Escolha o combustivel antes de abastecer.</p></div>
<div id="status-content" class="hidden"><div class="status-grid"><div><small>COMBUSTIVEL</small><strong id="status-fuel">0%</strong></div><div><small>QUILOMETRAGEM</small><strong id="status-mileage">0 km</strong></div></div><h2>Manutencao</h2><div id="maintenance"></div><p class="hint">Use as pecas de manutencao no inventario perto do veiculo.</p></div>
</section></main><script src="https://cfx-nui-ob_lib/web/currency.js"></script><script src="app.js"></script></body></html>
