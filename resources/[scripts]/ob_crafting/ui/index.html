<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="app.css"><title>Fabricacao</title></head>
<body>
<main id="app" class="hidden">
  <aside>
    <div class="brand"><span>⚒️</span><div><strong>Fabricacao</strong><small>OFICINA E PRODUCAO</small></div></div>
    <div id="mode" class="mode">BANCADA PUBLICA</div>
    <div class="level"><small>NIVEL ATUAL</small><b id="level">1</b><div class="bar"><i id="xpbar"></i></div><span id="xp">0 / 500 XP</span></div>
  </aside>
  <section>
    <header><div><small id="category">BANCADA</small><h1 id="station">Fabricacao</h1></div><button id="close">Fechar&nbsp; <b>ESC</b></button></header>
    <div class="stats"><article><span>Producoes</span><strong id="crafts">0</strong></article><article><span>Sucessos</span><strong id="successes">0</strong></article><article><span>Capacidade</span><strong id="batch">1–5</strong></article></div>
    <h2>Receitas disponiveis</h2><div id="recipes" class="recipes"></div>
  </section>
</main>
<script src="app.js"></script>
</body></html>
