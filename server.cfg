## You SHOULD edit the following:
#sv_hostname "OB Framework"
#sets sv_projectName "OB Framework"
#sets sv_projectDesc "Framework proprietaria para FiveM"
#sets tags "Enhanced, obframework, QB"
#sets locale "pt-BR"
#load_server_icon logo.png

## A OB Framework usa notificacoes proprias; desativa o chat padrao do FiveM.
setr chat_showJoins false
setr chat_showQuits false
stop chat

## You CAN edit the following:
# A chave Cfx fica no server.private.cfg sanitizado.
sv_maxclients 8
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_enforceGameBuild 3889

# Nao habilite sv_devMode em servidor acessivel ao publico. As permissoes de
# desenvolvimento da OB continuam controladas pelo ACE or.developer.
#sv_devMode true

## Protecoes nativas de rede do Cfx.
## O modo 1 bloqueia pedidos de controle de entidades controladas por outro
## jogador sem impedir os veiculos/NPCs criados legitimamente pelos recursos.
sv_scriptHookAllowed false
set sv_filterRequestControl 1
set sv_enableNetworkedSounds false
set sv_enableNetworkedPhoneExplosions false
set sv_enableNetworkedScriptEntityStates false
setr sv_stateBagStrictMode true
set onesync_population true
sv_entityLockdown relaxed


## Limite moderado contra spam de eventos. Os callbacks OB possuem tambem
## limites individuais no servidor, entao trafego normal continua folgado.
set rateLimiter_netEvent_rate 40
set rateLimiter_netEvent_burst 100

## Valores locais e secretos. Edite server.private.cfg, nunca publique credenciais.
exec server.private.cfg

## Acesso da OB Framework.
## As regras precisam existir antes dos recursos iniciarem.
add_ace group.admin command allow # allow all commands
add_ace group.admin command.quit deny # but don't allow quit
add_ace group.admin or.admin allow # permissoes da OB Framework
add_ace group.dev or.developer allow # acesso ao modo de desenvolvimento da OB Framework

# Durante o desenvolvimento, quem pode entrar como dev tambem administra a base.
add_principal group.dev group.admin
add_principal identifier.fivem:SEU_IDENTIFICADOR group.admin # Substitua pelo seu identifier
add_principal identifier.fivem:SEU_IDENTIFICADOR group.dev # Substitua pelo seu identifier

## Base da OB Framework.
ensure ob_database
ensure ob_lib
ensure ob_core
ensure ob_vehiclefailure
ensure ob_voice
# Adaptador OB para celulares/radios; o PMA original esta em archive.
ensure pma-voice
ensure ob_diagnostics
ensure ob_target
ensure ob_inventory
ensure ob_vehiclekeys
ensure ob_admin
ensure ob_adminmenu
ensure ob_editor
ensure ob_creator
ensure ob_multichar
ensure ob_spawn

## System
ensure [system]

## Scritps
ensure [scripts]

## Maps
ensure [maps]

## Props
ensure [props]

## Veiculos adicionais
ensure [cars]
